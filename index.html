<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음 남기기</title>
<meta name="description" content="함께했던 분들께 마음을 남겨 주세요.">
<meta property="og:title" content="마음을 남겨 주세요">
<meta property="og:description" content="롤링페이퍼 · 글, 사진, 영상 무엇이든 좋아요">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FCEFE2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap">
<style>
:root{
  --paper:#FCEFE2; --surface:#FFF9F2; --ink:#4D3527; --ink-soft:#8C6E5B; --line:#EFD8C3; --accent:#E07E4F;
  --juhan:#4F8F7F; --yujin:#C8667D; --suyeon:#5A86B0;
  --shadow:0 1px 2px rgba(110,70,40,.08),0 8px 20px -10px rgba(150,90,50,.28);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  background-color:var(--paper);
  background-image:radial-gradient(55rem 38rem at 105% -8%,rgba(255,190,140,.60),transparent 62%),radial-gradient(42rem 32rem at -12% 18%,rgba(250,200,200,.45),transparent 62%),linear-gradient(180deg,#FFE6CF 0%,#FCEFE2 40%,#FBF0E4 100%);
  padding:calc(48px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  word-break:keep-all;
}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:28px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0;color:var(--ink-soft);font-size:19px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:grid;gap:6px;padding:22px 22px 20px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;border:1.5px solid transparent;transition:transform .15s ease,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.who{font-family:var(--f-display);font-size:26px}
.due{font-size:16px;color:var(--ink-soft)}
.go{font-family:var(--f-display);font-size:16px;color:var(--accent)}
.nm-juhan{color:var(--juhan)} .nm-yujin{color:var(--yujin)} .nm-suyeon{color:var(--suyeon)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>누구에게 마음을 남길까요?</h1>
  <p>마음을 전할 분의 페이지를 골라 주세요. 모은 마음은 한 분 한 분께 기념 앨범으로 전해 드릴게요.</p>
  <div class="cards">
    <a class="card" href="juhan.html">
      <span class="who"><span class="nm-juhan">주한님</span>께</span>
      <span class="due">11월 25일 마감</span>
      <span class="go">마음 남기러 가기 →</span>
    </a>
    <a class="card" href="yujin.html">
      <span class="who"><span class="nm-yujin">유진님</span>께</span>
      <span class="due">11월 25일 마감</span>
      <span class="go">마음 남기러 가기 →</span>
    </a>
    <a class="card" href="suyeon.html">
      <span class="who"><span class="nm-suyeon">수연님</span>께</span>
      <span class="due">12월 6일 마감</span>
      <span class="go">마음 남기러 가기 →</span>
    </a>
  </div>
</div>
</body>
</html>
